    started=true;
    modeSync();
    db.doc('cr/settings').onSnapshot(function(sn){ settings=(sn.exists&&sn.data())||{}; settingsLoaded=true; render(); },function(){ settingsLoaded=true; render(); });
    if(!accountOwner) db.doc('cr/pay/'+uid).onSnapshot(function(sn){ claim=(sn.exists&&sn.data())||null; render(); },function(){});
    setInterval(function(){ var k=subOk(); if(k!==lastSubOk){ lastSubOk=k; sig=''; render(); } },20000);
    if(accountOwner){ meLoaded=true; startData(); render(); callBack(0); return; }
    var made=false;
    db.doc('cr/users/'+uid).onSnapshot(async function(s){
      if(!s.exists){
        meLoaded=true; me=null; render();
        if(!made){ made=true; try{ await db.doc('cr/users/'+uid).set({n:myName||'New user',ph:myPhone||'',st:'pending',at:Date.now()}); }catch(e){ made=false; } }
        return;
      }
      var oldRl=me&&me.rl; me=s.data(); meLoaded=true; var rlChanged=started&&startData.done&&(oldRl||'')!==(me.rl||'');
      if(rlChanged){ modeSync(); logSub(); watchUsers(); }
      if(me.st==='ok'){ var first=!startData.done; startData(); if(first) callBack(0); }
      render();
    },function(){ meLoaded=true; render(); });
    render();
  }catch(e){ $('#body').textContent=''; $('#body').append(mk('p','pmeta','Could not connect. Check your internet and reload.')); }
})();
})();
</script>
</body></html>
