<style>

.two{display:grid; grid-template-columns:1fr 1fr; gap:8px}

#toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(16px + env(safe-area-inset-bottom, 0px)); background:var(--ink); color:var(--bg); padding:10px 14px; border-radius:12px; max-width:calc(100vw - 32px); z-index:50}

.modes{display:grid; grid-template-columns:1fr 1fr; gap:6px; padding:4px; border:1.5px solid var(--accent); border-radius:18px; background:color-mix(in srgb,var(--accent) 12%,var(--card))}

.modes .btn[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink); border-color:var(--accent); cursor:default}
.modes .btn:not([aria-pressed="true"]){background:transparent; border-color:transparent}
.fab{position:fixed; right:max(12px, env(safe-area-inset-right, 0px)); bottom:calc(10px + env(safe-area-inset-bottom, 0px) * .3); width:54px; height:54px; border-radius:50%; border:0; background:var(--accent); color:var(--accent-ink); font-size:2rem !important; line-height:1; padding:0 0 3px; box-shadow:0 4px 14px rgba(0,0,0,.35); z-index:40; cursor:pointer; top:auto !important; left:auto !important; margin:0; transform:translate3d(0,0,0); -webkit-transform:translate3d(0,0,0); will-change:transform; -webkit-backface-visibility:hidden}
.fab[hidden]{display:none !important}
.bot{display:flex; gap:8px; align-items:center; justify-content:space-between; flex-wrap:wrap}
</style></head><body>

<script>
(function(){

/* ---------- state ---------- */

var sub='home', homeQ='', callQ='', callG='', callLs='', callLg='', sig='';
var CALL_OUT=[['spoke','Spoke'],['noans','No answer'],['busy','Busy'],['wrong','Wrong number'],['off','Switched off'],['cb','Call back later']];
function callOutName(k){ var o=CALL_OUT.filter(function(x){ return x[0]===k; })[0]; return o?o[1]:''; }

function grList(){ return Object.keys(groups).filter(function(k){ return k!=='none'&&groups[k]&&groups[k].n; }).map(function(k){ return [k,groups[k]]; }).sort(byName); }

function tint(el,i){ el.style.background=i%2?'color-mix(in srgb,var(--accent) 14%,var(--card))':'color-mix(in srgb,var(--loss) 16%,var(--card))'; }
function btn(label,fn,cls){ var b=mk('button','btn small'+(cls?' '+cls:''),label); b.type='button'; b.addEventListener('click',fn); return b; }
function dlg(id){ var d=$('#'+id); if(!d){ d=document.createElement('dialog'); d.id=id; document.body.append(d); d.addEventListener('click',function(e){ if(!e.target.closest('.dbody')) d.close(); }); } d.textContent=''; var b=mk('div','dbody'); d.append(b); return [d,b]; }

/* ---------- storage ---------- */

}

function listToMap(list,prefix){ var m={}; (list||[]).forEach(function(x){ m[x.path.slice(prefix.length)]=x.data||{}; }); return m; }
function logSub(){
  logStops.forEach(function(f){ try{ f(); }catch(e){} }); logStops=[]; var k=logKey; logRows={};
  if(!approved()){ return; }
  if(accountOwner){
    logStops.push(watchPrefix('cr/log/'+k+'/',function(list){ if(k!==logKey) return; var m={}; (list||[]).forEach(function(x){ var cl=(x.data&&x.data.cl)||{}; Object.keys(cl).forEach(function(id){ m[id]=cl[id]; }); }); logRows=m; render(); }));
  }else{
    var st=db.doc('cr/log/'+k+'/'+uid).onSnapshot(function(s){ if(k!==logKey) return; logRows=(s.exists&&s.data()&&s.data().cl)||{}; render(); },function(){});

/* ---------- dialer ---------- */
var CALL_KEY='crCallPend';
function pendGet(){ try{ return JSON.parse(localStorage.getItem(CALL_KEY)||'null'); }catch(e){ return null; } }

function callStart(cid){
  var c=ctGet(cid); if(!c) return;
  if(!approved()){ toast('Your account is waiting for approval.'); return; }
  var n=telNum(c.p); if(!n){ toast('This contact has no phone number.'); return; }
  pendSet({id:callId(),c:cid,n:c.n,p:c.p,g:c.g||'',gn:(c.g&&groups[c.g]?groups[c.g].n:''),at:Date.now(),hid:0,by:callerName(),sid:uid});

function callHidden(){ var p=pendGet(); if(p&&!p.hid){ p.hid=Date.now(); pendSet(p); } }
async function callBack(tries){

document.addEventListener('visibilitychange',function(){ if(document.hidden) callHidden(); else callBack(0); });
window.addEventListener('pagehide',callHidden);
window.addEventListener('pageshow',function(){ callBack(0); });
function repOpen(id,e,k){
  var r=dlg('dlgRep'), d=r[0], b=r[1];
  b.append(mk('h2',null,'Call Report'));
  b.append(mk('p','pmeta',e.n+' · '+e.p+(clGroup(e)?' · '+clGroup(e):'')+(e.d?' · About '+callDur(e.d):'')));
  var os=document.createElement('select'), ph=mk('option',null,'Choose what happened'); ph.value=''; os.append(ph);
  CALL_OUT.forEach(function(x){ var o=mk('option',null,x[1]); o.value=x[0]; os.append(o); }); os.value=e.o||'';
  var tx=document.createElement('textarea'); tx.rows=5; tx.maxLength=600; tx.value=e.r||''; tx.placeholder='Short summary of the conversation';
  var nx=document.createElement('input'); nx.type='date'; nx.value=e.nx||'';

    var o=os.value, t=cleanName(tx.value);

    var p={}; p[id]={o:o,r:t.slice(0,600),nx:nx.value||null,ra:Date.now()};

/* ---------- dialogs ---------- */
function groupSel(cur,withAll){
  var s=document.createElement('select'); if(withAll){ var a=mk('option',null,'All groups'); a.value=''; s.append(a); }
  var n=mk('option',null,'No group'); n.value=withAll?'-':''; s.append(n);
  grList().forEach(function(it){ var o=mk('option',null,it[1].n); o.value=it[0]; s.append(o); });

}
function ctEdit(id){
  var c=id?ctGet(id):{n:'',p:'',g:'',nt:''}; if(id&&!c) return;
  var r=dlg('dlgCt'), d=r[0], b=r[1];
  b.append(mk('h2',null,id?'Edit Contact':'Add Contact'));
  var nm=mkIn('text','Name',c.n), ph=mkIn('tel','Phone number',c.p), gs=groupSel(c.g,false), nt=mkIn('text','Note (optional)',c.nt||''), er=mk('p','pmeta');

  var row=mk('div','two'), sv=mk('button','btn primary','Save'), cn=mk('button','btn','Cancel'); sv.type=cn.type='button'; row.append(sv,cn);
  b.append(fld('Name',nm),fld('Phone number',ph),fld('Group',gs),fld('Note',nt),er,row);

function ctBulk(){
  var r=dlg('dlgCt'), d=r[0], b=r[1];
  b.append(mk('h2',null,'Add Many Contacts'));
  b.append(mk('p','pmeta','One contact per line: name, then phone number. For example: Ravi Kumar, 98765 43210'));
  var ta=document.createElement('textarea'); ta.rows=8; ta.maxLength=8000; var gs=groupSel('',false), er=mk('p','pmeta'); er.style.color='var(--warn)';
  var row=mk('div','two'), sv=mk('button','btn primary','Add'), cn=mk('button','btn','Cancel'); sv.type=cn.type='button'; row.append(sv,cn);
  b.append(fld('Contacts',ta),fld('Group for all',gs),er,row);
  cn.addEventListener('click',function(){ d.close(); });

    var seen={}; ctAll().forEach(function(it){ seen[digitsOf(it[1].p)]=1; });

function grEdit(id){
